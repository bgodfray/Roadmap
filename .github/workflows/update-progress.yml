name: Update Progress Badge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug file structure
        run: |
          echo "📁 Listing repository files:"
          ls -R
          echo "✅ Checking for 2026/README.md..."
          if [ -f 2026/README.md ]; then
            echo "Found 2026/README.md ✅"
          else
            echo "⚠️ File not found: 2026/README.md"
          fi

      - name: Calculate 2026 progress
        id: progress
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path
          import os

          roadmap_file = Path("2026/README.md")

          if not roadmap_file.exists():
              print("⚠️ File 2026/README.md not found. Setting progress to 0%.")
              percent = 0
          else:
              text = roadmap_file.read_text(encoding="utf-8")
              checkboxes = re.findall(r"- \[[ xX]\]", text)
              checked = len(re.findall(r"- \[[xX]\]", text))
              total = len(checkboxes)
              percent = int((checked / total) * 100) if total else 0

          print(f"📊 Progress: {percent}%")

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"PROGRESS={percent}\n")
          EOF

      - name: Update progress badge in root README
        run: |
          BADGE="![Progress](https://img.shields.io/badge/Progress-${PROGRESS}%25-brightgreen)"
          echo "🔄 Updating progress badge in README.md"
          if grep -q "!\[Progress\]" README.md; then
            sed -i "s|!\[Progress\](.*)|${BADGE}|" README.md
          else
            echo -e "\n${BADGE}" >> README.md
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🧭 Update progress badge to ${PROGRESS}% [skip ci]" || echo "No changes to commit"
          git push
