name: Update Progress Badge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-progress:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Calculate 2026 progress
        id: progress
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path
          import os

          # Only track the 2026 roadmap file
          roadmap_file = Path('2026/README.md')

          if not roadmap_file.exists():
              print("File 2026/README.md not found.")
              percent = 0
          else:
              text = roadmap_file.read_text(encoding='utf-8')
              total = len(re.findall(r'- \[.\]', text))
              checked = len(re.findall(r'- \[x\]', text, re.IGNORECASE))
              percent = int((checked / total) * 100) if total else 0

          print(f'Progress: {percent}%')

          # Save to GitHub Actions environment variable
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PROGRESS={percent}\\n')
          EOF

      - name: Update README badge
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path
          import os

          root_readme = Path('README.md')
          if not root_readme.exists():
              print("Root README.md not found. Skipping badge update.")
          else:
              text = root_readme.read_text(encoding='utf-8')
              new_badge = f"https://img.shields.io/badge/Progress-{os.environ['PROGRESS']}%25-brightgreen?style=for-the-badge"

              updated = re.sub(
                  r"https://img\\.shields\\.io/badge/Progress-[0-9]+%25-[^?]+\\?style=for-the-badge",
                  new_badge,
                  text
              )

              root_readme.write_text(updated, encoding='utf-8')
          EOF

      - name: Commit and push badge update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Auto-update 2026 roadmap progress to ${PROGRESS}%" || echo "No changes to commit"
          git push
